<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex" />
<title>glovej.ca — redirecting…</title>
<style>
body {
margin: 0;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
background: #0d0b14;
color: #9b94b0;
font-family: 'Space Grotesk', sans-serif;
font-size: 0.9rem;
}
a { color: #9b4ff0; }
</style>
</head>
<body>
<p id="msg">Taking you to the latest post…</p>
<script>
// Permanent redirect target for bio links etc. Instagram (and some other
// platforms) percent-encode "#" in profile link fields, which breaks a
// plain hash-based link like /writing#latest. This page avoids the
// problem entirely by using a real path with no hash, then resolving
// the actual newest post client-side and forwarding the browser there.
fetch('/writing/posts.json')
.then(res => res.json())
.then(posts => {
if (!posts.length) throw new Error('no posts');
const newest = posts[posts.length - 1]; // posts.json is oldest-first
window.location.replace('/writing#' + newest.slug);
})
.catch(() => {
document.getElementById('msg').innerHTML =
'Couldn\'t load the latest post — <a href="/writing">browse all writing instead</a>.';
});
</script>
</body>
</html>
